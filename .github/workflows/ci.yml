# ----------------------------------------------------------------------------
# CI quality gate — Phase 2C, ADR-0028.
#
# Every pull request and every push to ``main`` runs the full 10-stage pipeline:
#
#   ruff → black --check → mypy → pytest → alembic upgrade → alembic downgrade
#        → alembic upgrade → schema validator → ERD comparison → coverage
#
# The pipeline is implemented in ``backend/scripts/ci_gate.py`` so it can run
# byte-identically on a developer laptop (see CI_QUALITY_GATE.md). This file
# only wires the GitHub Actions runtime, a pgvector-enabled PostgreSQL service
# container, and artefact uploads.
# ----------------------------------------------------------------------------

name: CI Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes. The latest
# commit is the only one that matters — older runs of an obsoleted branch
# tip cannot block the PR if a newer commit has already passed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ADR-0042 — Orchestration Platform Freeze. A lightweight governance guard,
  # separate from the ADR-0028 quality gate: it fails when a change touches a
  # frozen orchestration module (the stable platform API) without a conscious
  # override marker. This is deliberately fast (no DB, no install) so the
  # tripwire is cheap on every PR and push.
  freeze-guard:
    name: Orchestration freeze (ADR-0042)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so the guard can diff against the base ref / pushed range.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce orchestration platform freeze
        env:
          NO_COLOR: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "freeze-guard base ref: ${BASE}"
          python backend/scripts/check_frozen_platform.py --base "${BASE}"

  gate:
    name: Stages 1–10
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # PostgreSQL 16 with pgvector pre-installed. Pinning a digest is not
    # done here because the upstream image is versioned (``pgvector:pg16``)
    # and the gate's structural checks already validate the server version
    # in stage 8.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aivp
          POSTGRES_PASSWORD: aivp
          POSTGRES_DB: aivp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aivp -d aivp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://aivp:aivp@localhost:5432/aivp
      # CI logs are not a TTY; ``ci_gate.py`` already honours NO_COLOR and
      # --no-color but the env var is the kinder default for tools that
      # do not yet support the flag.
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify required extensions are available in the service DB
        env:
          PGPASSWORD: aivp
        run: |
          # The pgvector image installs the extension binaries but does
          # not create the SQL objects — Alembic does that in stage 5.
          # We assert here only that the binaries exist so the migration
          # cannot fail in confusing ways.
          for ext in pgcrypto citext pg_trgm vector btree_gin; do
            psql -h localhost -U aivp -d aivp -tAc \
              "SELECT 1 FROM pg_available_extensions WHERE name = '${ext}'" \
              | grep -q '^1$' || { echo "missing extension: ${ext}"; exit 1; }
          done

      # Stages 1–4 + 10 (lint, format, types, unit tests, coverage) plus
      # the live-DB stages 5–9. All driven by the single Python entrypoint
      # so a developer's local invocation is byte-identical to CI.
      - name: Run CI gate
        working-directory: backend
        run: python scripts/ci_gate.py --no-color

      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-artefacts
          path: |
            backend/.validation/schema_validation_report.json
            backend/.validation/erd_generated.md
            backend/.validation/erd_diff.json
            backend/.validation/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      # Surface the coverage report as a job summary so reviewers see the
      # delta directly in the PR's Checks tab without opening artefacts.
      - name: Append coverage to job summary
        if: always()
        working-directory: backend
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
