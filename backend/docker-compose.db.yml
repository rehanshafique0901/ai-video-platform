services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aivp-postgres
    environment:
      POSTGRES_USER: aivp
      POSTGRES_PASSWORD: aivp
      POSTGRES_DB: aivp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivp -d aivp"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - aivp_pgdata:/var/lib/postgresql/data

volumes:
  aivp_pgdata: {}
