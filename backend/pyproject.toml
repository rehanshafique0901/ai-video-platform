[project]
name = "ai-video-platform-backend"
version = "0.2.0"
description = "AI Video Generation SaaS — backend (Phase 2: database layer)"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # Phase 3 Slice α1 (architecture bootstrap) — added 2026-06-30.
    "fastapi>=0.115.0",                # HTTP framework + DI + OpenAPI
    "argon2-cffi>=23.1.0",             # Argon2id password hashing (ADR-0008)
    "pyjwt[crypto]>=2.9.0",            # JWT issue/verify (ADR-0008)
    "uvicorn[standard]>=0.32.0",       # ASGI server (local dev + container entry)
    # Phase 3 Slice α2a (auth: register + login) — added 2026-07-01.
    # Pydantic ``EmailStr`` requires this package at runtime; it validates
    # e-mail address structure per RFC 5321/5322 + IDN. Used by the auth
    # request DTOs in ``app/api/v1/schemas/auth.py``.
    "email-validator>=2.2.0,<3",
    # Phase 3 Slice α8.1 (first real provider: OpenAI Images) — added 2026-07-21.
    # Async HTTP client the provider adapters call. Promoted from the `dev`
    # extra to a core runtime dependency now that a real provider ships.
    "httpx>=0.27.0",
    # Phase 3 Slice α8.5b.2 (multi-backend storage + signed-URL delivery) — added 2026-07-24.
    # AWS SDK for the S3/R2 object-storage adapter + offline presigned-URL generation.
    # Import is confined to app/infrastructure/{storage,delivery} (import-linter contract);
    # R2 reuses the same S3-compatible client with a different injected endpoint.
    "boto3>=1.35.0",
    # Generation slice (α8.6) — image feature extraction for the verification
    # runtime (dimensions, blank/near-uniform detection, perceptual-hash
    # cross-frame consistency) and image normalisation before ffmpeg assembly.
    # Import is confined to app/infrastructure adapters, never the domain.
    "pillow>=11.0.0",
]

# Two dev groups so CI installs only what it needs.
#
# `dev`        = code-quality tooling (ruff/black/mypy/pytest). Pure-Python,
#                cross-platform, used by `ci_gate` stages 1–4 and 10.
# `validation` = the harness's optional dependencies for the live-DB stages
#                5–9. The validator and ERD regenerator themselves ship
#                inside `scripts/` and only need sqlalchemy + pgvector
#                (already pinned above); this group is reserved for future
#                additions such as `pg-activity` or `eralchemy2` when the
#                team is on a non-Windows host.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit package discovery — without this, setuptools sees `app` AND
# `alembic` as candidate top-level packages and refuses to build. We only
# ship `app/`; `alembic/`, `scripts/`, and `tests/` are project tooling,
# not runtime code.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "scripts*", "tests*", ".validation*"]

[project.optional-dependencies]
dev = [
    # Lint + format + type-check
    "ruff==0.7.1",
    "black==24.10.0",
    "mypy==1.13.0",
    # Architectural fitness function — Phase 3 will activate the real
    # `app/api` and `app/application` boundaries; the rule is shipped now
    # so a violation can never land silently.
    "import-linter==2.1",
    # Tests + coverage
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.24.0",
    # NB: httpx (FastAPI TestClient + the integration suite's AsyncClient) is a
    # core runtime dependency as of α8.1 — see [project.dependencies] above.
    # Type stubs for libraries the test suite touches.
    "types-PyYAML==6.0.12.20240917",
    # YAML loader used by some CI integrations & schema fixtures.
    "pyyaml>=6.0.2",
]
validation = [
    "eralchemy2>=1.4.1; platform_system != 'Windows'",
    "sqlalchemy-schemadisplay>=2.0",
    "pygraphviz>=1.13; platform_system != 'Windows'",
]

# ---------------------------------------------------------------------------
# Ruff — fast Python linter. Stage 1 of the CI gate.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".validation"]

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes basics. I = import sorting. B = bugbear.
# UP = pyupgrade (3.12 idioms). N = pep8-naming. SIM = simplifications.
# C4 = comprehensions. RUF = ruff-native rules.
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = [
    # Enforced by black, not ruff.
    "E501",
    # FastAPI/Pydantic patterns use call defaults intentionally.
    "B008",
    # The SQLAlchemy convention is `from sqlalchemy.dialects.postgresql
    # import UUID as PgUUID` so the alias visibly distinguishes from
    # stdlib `uuid.UUID`. Forcing PEP-8 constant naming on type aliases
    # would invert that convention.
    "N811",
    # En-dash / em-dash in human-readable docstrings and comments is a
    # stylistic choice the docs use deliberately (the design documents
    # under ``docs/`` use them throughout). Code itself is unaffected.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Migration files are autogenerated by Alembic — relax naming + complexity.
"alembic/versions/*.py" = ["N", "B", "SIM", "C4"]
# Tests are allowed to use bare asserts and longer setup.
"tests/**/*.py" = ["B011"]
# Scripts use ad-hoc SQL strings and accept user-supplied paths.
"scripts/*.py" = ["B008", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

# ---------------------------------------------------------------------------
# Black — formatting check. Stage 2 of the CI gate.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
# Black does not need to touch Alembic auto-generated files; they have
# their own style enforced by the Alembic template.
extend-exclude = '''
/(
    alembic/versions
  | \.validation
)/
'''

# ---------------------------------------------------------------------------
# Mypy — type-check. Stage 3 of the CI gate.
#
# Scope is intentionally narrowed to `app/` — the package that becomes the
# production codebase. `scripts/` (validation harness) and `tests/`
# (assertions, fixtures) are deliberately excluded because they use raw
# SQLAlchemy core constructs and dynamic patterns that don't benefit from
# strict typing.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
# Alembic migrations are excluded because they are autogenerated and use
# the `op.*` imperative API that has its own typing characteristics.
exclude = ["alembic/", "tests/", "scripts/", ".validation/"]
# SQLAlchemy 2.0 uses native typing via `Mapped[...]`; no plugin needed.
# Pydantic plugin gives strict validation of model field annotations.

[[tool.mypy.overrides]]
# pgvector ships its own types but no py.typed marker yet.
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore do not ship a py.typed marker (typed stubs live in the separate
# boto3-stubs package). The SDK is confined to the storage/delivery adapters
# (import-linter contract), so untyped surface stays isolated there.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest — Stage 4 of the CI gate.
#
# We split test selection by marker so CI stage 4 runs the fast suite
# (unit + metadata smoke) before the live-DB stages 5–9 run, and so that
# `pytest -m integration` can be invoked once a real DB is available.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                # report short summary of all non-passes
    "--strict-markers",   # any unregistered marker fails the suite
    "--strict-config",
    "-q",
]
markers = [
    "unit: pure-Python unit test (no DB, no I/O)",
    "integration: requires a live PostgreSQL + pgvector",
]
asyncio_mode = "auto"
# Phase 3 Slice α1 — pin the loop scope for async fixtures so the
# pytest-asyncio deprecation warning ("event loop scope is unset") goes
# away and behaviour is stable across future pytest-asyncio releases.
asyncio_default_fixture_loop_scope = "function"
# Default = run only `unit` so stage 4 stays fast and stages 5–9 own the
# integration surface. CI can opt in via `pytest -m 'unit or integration'`.
filterwarnings = [
    "error",
    # Pydantic v2 still emits DeprecationWarnings from third-party libs we
    # don't control; downgrade to a warning so they don't sink the suite.
    "default::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage — Stage 10 of the CI gate.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/**/__init__.py",
    "alembic/**",
]

[tool.coverage.report]
# Phase 2C ships a smoke suite; the threshold is intentionally low because
# repositories and services don't exist yet. Phase 3 will bump this to 80%
# once unit tests are written for repositories. See ADR-0028.
fail_under = 60
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Import-Linter — architectural fitness functions.
# Run as part of `ci_gate` stage 3 alongside mypy (both are "static analysis
# of the source tree"; same dependency set; same failure semantics).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# Required so the cloud-SDK isolation contract (α8.5b.2) can name external
# forbidden modules (boto3 / botocore) — see the contract below.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer has no infrastructure / application / api dependencies"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.infrastructure", "app.api", "app.application"]

[[tool.importlinter.contracts]]
name = "DB models cannot import application or API layers"
type = "forbidden"
source_modules = ["app.infrastructure.db"]
forbidden_modules = ["app.application", "app.api"]

[[tool.importlinter.contracts]]
# The intent is "no direct SQLAlchemy / argon2 / pyjwt imports inside
# routers" — preventing infrastructure types from leaking into HTTP
# handlers. The composition root (``app.core.container``) is the
# legitimate bridge: it imports infrastructure to wire the singletons,
# and ``app.api.v1.deps`` imports the container to expose FastAPI
# dependency providers. That creates an *indirect* chain
# (api → core → infrastructure) which is allowed by this contract by
# design — only *direct* infrastructure imports from inside ``app.api``
# are forbidden.
name = "API layer talks to application services, never directly to infrastructure"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.infrastructure"]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
# Application services orchestrate domain + repositories; they must not be
# pulled in by the domain layer (already covered above) or import the api
# layer (which would invert the dependency direction).
name = "Application layer never imports the API layer"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
# Phase 3 Slice α2a — introduced when ``app.application.use_cases`` first
# appears. Use cases must depend only on domain entities + ports
# (``app.application.interfaces``) + ``app.core.errors``. Direct imports
# from ``app.infrastructure`` (concrete SQLAlchemy repositories, argon2,
# pyjwt) or ``app.api`` (HTTP concerns) would invert the layered model.
# The composition root (``app.core.container``) still bridges them —
# that indirection is by design and is not caught by this ``forbidden``
# contract because the use-case module itself does not import
# infrastructure.
name = "Application use_cases never import infrastructure or api"
type = "forbidden"
source_modules = ["app.application.use_cases"]
forbidden_modules = ["app.infrastructure", "app.api"]

[[tool.importlinter.contracts]]
# Phase 3 Slice α7.4 — the provider capability leaf. Provider adapters,
# the registry, and the mocks (``app.infrastructure.ai.providers``) are a
# strict leaf: they implement the neutral contract in
# ``app.application.interfaces.providers`` (DTOs / errors / metadata) — the
# same allowed direction every repository uses — but must never reach up
# into orchestration/business logic (``app.application.use_cases``), the HTTP
# layer (``app.api``), or the workflow domain (``StepCommand`` &c). The
# ``StepCommandDispatcher`` that bridges ``StepCommand`` → capability calls
# deliberately lives one level up (``app.infrastructure.ai.dispatcher``),
# outside this leaf, so this contract can stay strict.
name = "Provider capability leaf never imports orchestration, api, or the workflow domain"
type = "forbidden"
source_modules = ["app.infrastructure.ai.providers"]
forbidden_modules = [
    "app.application.use_cases",
    "app.api",
    "app.domain.workflow",
]

[[tool.importlinter.contracts]]
# Phase 3 Slice α8.5b.2 — the cloud storage SDK (boto3/botocore, used for the S3/R2
# object-storage adapter + presigned-URL delivery) is a strict infrastructure-leaf
# concern. It must stay confined to the storage/delivery adapter packages; no SDK type
# may leak above the ``StorageResolver`` / ``IDownloadDelivery`` seams (α8.5b.2 Ruling D).
# The domain, application, api, and composition-root (core) layers must never import it.
name = "Cloud storage SDK is confined to the storage/delivery adapters"
type = "forbidden"
source_modules = [
    "app.domain",
    "app.application",
    "app.api",
    "app.core",
]
forbidden_modules = ["boto3", "botocore"]
# Only *direct* SDK imports from these layers are forbidden. The composition root
# (``app.core.container``) legitimately imports the ``app.infrastructure.{storage,delivery}``
# packages to wire the adapters, and those packages import boto3 — an *indirect* chain
# (core → infrastructure → boto3) that is allowed by design, exactly like the
# "API talks to application services" contract above. Any layer here that wrote
# ``import boto3`` itself would be a direct edge and would fail this contract.
allow_indirect_imports = "True"
