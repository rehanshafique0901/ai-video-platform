# AI capability -> provider graph (Phase 3 α8.5c) — DESIGN-TIME spec.
#
# The runtime NEVER reads this file (W8.5c.2). Every field here is STATIC
# (W8.5c.3): operational state (health, latency, quota remaining, success rate,
# last error, consecutive failures) lives in the database, never here.
#
# Selection is score + routing-strategy driven — there is NO integer priority
# anywhere (R3). All adapters below are `planned` (no code yet); implementing an
# adapter is an additive follow-up behind the existing capability protocols.
#
# free-first seed: the initial curated set leans on free / open providers so the
# future resolver's default `free_first` strategy has real options to choose from.

providers:
  - id: pollinations
    name: Pollinations
    homepage: https://pollinations.ai
    license: open
    commercial: true
    authentication: none
    free:
      available: true
      signup_required: false
      api_key_required: false
      daily_limit: unlimited
      monthly_limit: unlimited
      watermark: false
    config_keys: []
    scores: { quality: 70, cost: 100, speed: 90, reliability: 72 }
    adapters:
      - { id: pollinations.image, capability: image_generation, status: planned }
      - { id: pollinations.text, capability: text_generation, status: planned }

  - id: huggingface
    name: Hugging Face Inference
    homepage: https://huggingface.co
    license: open
    commercial: true
    authentication: api_key
    free:
      available: true
      signup_required: true
      api_key_required: true
      daily_limit: 1000
      monthly_limit: unlimited
      watermark: false
    config_keys: [HUGGINGFACE_API_KEY]
    scores: { quality: 80, cost: 95, speed: 65, reliability: 78 }
    adapters:
      - id: huggingface.image
        capability: image_generation
        status: planned
        fallback: [pollinations.image]
      - { id: huggingface.embedding, capability: embedding, status: planned }
      - { id: huggingface.translation, capability: translation, status: planned }

  - id: fal
    name: fal.ai
    homepage: https://fal.ai
    license: proprietary
    commercial: true
    authentication: api_key
    free:
      available: true
      signup_required: true
      api_key_required: true
      daily_limit: 100
      monthly_limit: 1000
      watermark: false
    config_keys: [FAL_API_KEY]
    scores: { quality: 90, cost: 60, speed: 88, reliability: 90 }
    adapters:
      - id: fal.image
        capability: image_generation
        status: planned
        fallback: [huggingface.image, pollinations.image]
      - { id: fal.video, capability: video_generation, status: planned }

  - id: kokoro
    name: Kokoro TTS
    homepage: https://github.com/hexgrad/kokoro
    license: open
    commercial: true
    authentication: none
    free:
      available: true
      signup_required: false
      api_key_required: false
      daily_limit: unlimited
      monthly_limit: unlimited
      watermark: false
    config_keys: []
    scores: { quality: 78, cost: 100, speed: 85, reliability: 70 }
    adapters:
      - { id: kokoro.tts, capability: text_to_speech, status: planned }

families:
  - id: flux
    parent: null
    variants:
      - { id: flux.dev, provider: fal }
      - { id: flux.schnell, provider: fal }
      - { id: flux.kontext, provider: fal }

routing:
  defaults:
    strategy: free_first
    fallback: automatic
    selection: best_available
  by_capability:
    video_generation:
      strategy: highest_quality
